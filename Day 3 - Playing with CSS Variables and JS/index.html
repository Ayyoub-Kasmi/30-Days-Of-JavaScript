<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Play with CSS Variables and JS</title>
	<link rel="stylesheet" href="style.css">
</head>
<body>
	<h1>Updating CSS variables using <span>JS</span></h1>
	<div class="frame">
		<div class="settings">

			<div class="container">
			<label for="blur">Blur  </label>
			<input id="blur" type="range" value="0">
			</div>

			<div class="container">
			<label for="position">Position</label>
			<input id="position" type="range" value="0">
			</div>

			<div class="container">
			<label for="background">Background</label>
			<input id="background" type="color" value="#ff0000">	
			</div>

		</div>

		<div class="image">
			<img src="yugi.jpg" alt="yugi">
		</div>

	</div>

	<script src="main.js"></script>
</body>
</html>
